<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Budget Tracker System</title>
        <link rel="preconnect" href="https://fonts.googleapis.com">
        <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
        <link
            href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;500;600;700&display=swap"
            rel="stylesheet">
        <link rel="stylesheet" href="style.css">
    </head>

    <body>

        <div class="container">

            <!-- Page Heading -->
            <h1>Budget Tracker System</h1>

            <div class="tracker-wrapper">

                <!-- Left Section -->
                <div class="left-section">

                    <!-- Add Budget -->
                    <div class="card">
                        <h2>Add Budget</h2>

                        <div class="input-group">
                            <label for="budgetInput">Budget</label>

                            <input
                                type="number"
                                id="budgetInput"
                                placeholder="Enter your budget">
                        </div>

                        <button id="addBudgetBtn">
                            Add Budget
                        </button>
                    </div>

                    <!-- Add Expense -->
                    <div class="card">
                        <h2>Add Expense</h2>

                        <div class="input-group">
                            <label for="expenseTitle">
                                Expense Title
                            </label>

                            <input
                                type="text"
                                id="expenseTitle"
                                placeholder="Enter expense title">
                        </div>

                        <div class="input-group">
                            <label for="expenseAmount">
                                Amount
                            </label>

                            <input
                                type="number"
                                id="expenseAmount"
                                placeholder="Enter amount">
                        </div>

                        <button id="addExpenseBtn">
                            Add Expense
                        </button>
                    </div>

                    <!-- Reset Button -->
                    <button id="resetBtn" class="reset-btn">
                        Reset All
                    </button>

                </div>

                <!-- Right Section -->
                <div class="right-section">

                    <!-- Summary -->
                    <div class="summary">

                        <div class="summary-card">
                            <h3>Total Budget</h3>
                            <p id="totalBudget">₹0</p>
                        </div>

                        <div class="summary-card">
                            <h3>Total Expenses</h3>
                            <p id="totalExpenses">₹0</p>
                        </div>

                        <div class="summary-card">
                            <h3>Budget Left</h3>
                            <p id="budgetLeft">₹0</p>
                        </div>

                    </div>

                    <!-- Expense History -->
                    <div class="expense-history">

                        <h2>Expense History</h2>

                        <div class="table-container">

                            <table>

                                <thead>
                                    <tr>
                                        <th>Expense Title</th>
                                        <th>Amount</th>
                                        <th>Action</th>
                                    </tr>
                                </thead>

                                <tbody id="expenseList">

                                    <!-- JavaScript will add expenses here -->

                                </tbody>

                            </table>

                        </div>

                    </div>

                </div>

            </div>

        </div>

        <!-- JavaScript -->
        <script src="script.js"></script>

    </body>
</html>
